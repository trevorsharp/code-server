name: code-server

services:
  code-server:
    build:
      context: ./setup
      args:
        USERNAME: sharp
        USER_UID: 504
        USER_GID: 20
        OPENCODE_VERSION: 2.0.16
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    container_name: code-server
    hostname: work-code-server
    environment:
      NOTIFY_SLACK_WEBHOOK_URL: ${NOTIFY_SLACK_WEBHOOK_URL:-}
      FIGMA_OAUTH_TOKEN: ${FIGMA_OAUTH_TOKEN:-}
      PAYMENTS_TESTING_AUTH_CLIENT_SECRET: ${PAYMENTS_TESTING_AUTH_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:2222:22"
      - "127.0.0.1:4096:4096"
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:3001:3001"
      - "127.0.0.1:3002:3002"
      - "127.0.0.1:5000:5000"
      - "127.0.0.1:5001:5001"
      - "127.0.0.1:5002:5002"
      - "127.0.0.1:9222:9222"
      - "127.0.0.1:19876:19877"
    volumes:
      - ./projects:/home/sharp/projects
      - /Users/TSharp/Downloads:/home/sharp/Downloads
      - workspaces:/home/sharp/workspaces
      - ./data/NuGet.Config:/home/sharp/.nuget/NuGet/NuGet.Config:ro
      - ./data/certs:/home/sharp/certs:ro
      - ./data/ssh:/home/sharp/.ssh:ro
      - ./data/ssh-host:/etc/ssh/host_keys
      - ./data/gitconfig:/home/sharp/.gitconfig:ro
      - ./data/git-data:/home/sharp/.git-data
      - ./data/vscode-server:/home/sharp/.vscode-server
      - ./data/azure:/home/sharp/.azure
      - ./data/gh:/home/sharp/.config/gh
      - ./data/opencode-config:/home/sharp/.config/opencode
      - ./data/opencode-storage:/home/sharp/.local/share/opencode
      - ./data/workspace-config:/home/sharp/.config/workspace

volumes:
  workspaces:
    external: true
    name: code-server-v2_workspaces
